<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WHOOP OAuth callback</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 720px; margin: 64px auto; padding: 0 24px; color: #21242B; line-height: 1.55; }
  h1 { font-size: 24px; font-weight: 600; }
  .box { background: #F2F3FF; padding: 16px 20px; border-radius: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; margin: 16px 0; font-size: 14px; }
  .label { color: #6672FF; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 24px; margin-bottom: 4px; font-weight: 600; }
  button { background: #6672FF; color: white; border: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 8px; }
  button:hover { background: #4855E0; }
  .err { color: #C0392B; }
  .ok { color: #27AE60; }
</style>
</head>
<body>
<h1>WHOOP OAuth callback</h1>
<p>Copy the authorization code below and paste it back to your assistant.</p>

<div class="label">Authorization code</div>
<div class="box" id="code">…</div>
<button onclick="copy('code')">Copy code</button>

<div class="label">State</div>
<div class="box" id="state">…</div>

<div class="label">Full callback URL</div>
<div class="box" id="full">…</div>
<button onclick="copy('full')">Copy full URL</button>

<div id="status" style="margin-top: 24px;"></div>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const state = params.get("state");
  const error = params.get("error");
  const errDesc = params.get("error_description");

  document.getElementById("full").textContent = window.location.href;

  if (error) {
    document.getElementById("code").textContent = "—";
    document.getElementById("state").textContent = "—";
    document.getElementById("status").innerHTML = '<p class="err">Error: ' + error + (errDesc ? " — " + errDesc : "") + '</p>';
  } else if (code) {
    document.getElementById("code").textContent = code;
    document.getElementById("state").textContent = state || "—";
    document.getElementById("status").innerHTML = '<p class="ok">Authorization granted. Copy the code and send it back.</p>';
  } else {
    document.getElementById("code").textContent = "(no code in URL)";
    document.getElementById("state").textContent = "(no state in URL)";
  }

  function copy(id) {
    const txt = document.getElementById(id).textContent;
    navigator.clipboard.writeText(txt);
  }
</script>
</body>
</html>
